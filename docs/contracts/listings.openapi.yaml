components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      description: Existing opaque Account session, not JWT; never put token in URI.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Actor-scoped durable mutation key, bound to method/resource/canonical normalized payload; never
        automatically replace an ambiguous or expired key.
    ListingId:
      name: listingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Title:
      type: string
      minLength: 10
      maxLength: 120
    Description:
      type: string
      minLength: 1
      maxLength: 5000
    Money:
      type: integer
      minimum: 0
      maximum: 1000000000
      description: Integer VND; explicit zero is allowed, null/absence must never imply free.
    Condition:
      type: string
      enum:
        - USED_GOOD
        - USED_FAIR
        - NEEDS_REPAIR
    LookupSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
    OwnerSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - avatarUrl
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        avatarUrl:
          type: string
          format: uri
          pattern: ^https://
          nullable: true
    SellListingInput:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - description
        - categoryId
        - areaId
        - condition
        - price
        - mediaIds
      properties:
        type:
          type: string
          enum:
            - SELL
        title:
          $ref: "#/components/schemas/Title"
        description:
          $ref: "#/components/schemas/Description"
        categoryId:
          type: string
          format: uuid
        areaId:
          type: string
          format: uuid
        condition:
          $ref: "#/components/schemas/Condition"
        price:
          $ref: "#/components/schemas/Money"
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 8
          uniqueItems: true
    SellListingUpdate:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - description
        - categoryId
        - areaId
        - condition
        - price
        - mediaIds
        - expectedVersion
      properties:
        type:
          type: string
          enum:
            - SELL
        title:
          $ref: "#/components/schemas/Title"
        description:
          $ref: "#/components/schemas/Description"
        categoryId:
          type: string
          format: uuid
        areaId:
          type: string
          format: uuid
        condition:
          $ref: "#/components/schemas/Condition"
        price:
          $ref: "#/components/schemas/Money"
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 8
          uniqueItems: true
        expectedVersion:
          type: integer
          minimum: 1
    BuyListingInput:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - description
        - categoryId
        - areaId
        - budget
        - mediaIds
      properties:
        type:
          type: string
          enum:
            - BUY
        title:
          $ref: "#/components/schemas/Title"
        description:
          $ref: "#/components/schemas/Description"
        categoryId:
          type: string
          format: uuid
        areaId:
          type: string
          format: uuid
        budget:
          type: integer
          minimum: 0
          maximum: 1000000000
          description: Required wire field, null represents optional/unspecified budget; never infer zero.
          nullable: true
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 0
          maxItems: 8
          uniqueItems: true
    BuyListingUpdate:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - description
        - categoryId
        - areaId
        - budget
        - mediaIds
        - expectedVersion
      properties:
        type:
          type: string
          enum:
