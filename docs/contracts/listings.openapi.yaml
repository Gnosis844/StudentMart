openapi: 3.0.3
info:
  title: StudentMart Listing API Contract
  version: 0.1.0
  description: "TASK-04.01 #121/#122 proposed contract for review. No listing endpoint, entity or migration is
    implemented by this ticket. Numeric bounds are explicit proposals pending user PR review; see
    listing-model.md. R02-R04/R08; US02-US04/US08; UF02a/UF02b."
servers:
  - url: http://localhost:3000/api/v1
    description: Development; device uses backend LAN origin.
tags:
  - name: Listings
    description: Posting and managing own listings; public search/detail/chat belong to TASK-05/06/07.
security:
  - bearerSession: []
paths:
  /listings:
    post:
      operationId: createListing
      tags:
        - Listings
      summary: Create one OPEN listing; optional school verification never blocks an otherwise permitted actor.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingRequest"
      responses:
        "201":
          description: "Server-confirmed response. Private/mutation replies use Cache-Control: no-store."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
        "400":
          description: Invalid fields, JSON, cursor or media ownership; whitelist enforced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          description: UNAUTHENTICATED or SESSION_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "403":
          description: "FORBIDDEN: current actor is restricted or lacks the action permission."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "404":
          description: NOT_FOUND; do not disclose another owner private listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "409":
          description: VERSION_CONFLICT, INVALID_TRANSITION, IDEMPOTENCY_CONFLICT, IDEMPOTENCY_IN_PROGRESS or
            MEDIA_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "410":
          description: IDEMPOTENCY_EXPIRED; do not repeat using a new key blindly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "413":
          description: PAYLOAD_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "415":
          description: UNSUPPORTED_MEDIA_TYPE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "429":
          description: RATE_LIMITED; respect Retry-After
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "503":
          description: SERVICE_UNAVAILABLE; mutation result may require reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        default:
          description: Safe INTERNAL_ERROR envelope, never provider response or stack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
  /me/listings:
    get:
      operationId: listOwnListings
      tags:
        - Listings
      summary: Only current actor listings, including ended/removed summaries; never accept accountId.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 1024
        - name: status
          in: query
          schema:
            type: string
            enum:
              - OPEN
              - COMPLETED
              - CLOSED
              - REMOVED
