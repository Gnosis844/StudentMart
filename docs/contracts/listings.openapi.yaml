          items:
            $ref: "#/components/schemas/ListingImage"
          minItems: 0
          maxItems: 8
        owner:
          $ref: "#/components/schemas/OwnerSummary"
        lifecycle:
          $ref: "#/components/schemas/Lifecycle"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExchangeListing:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - description
        - condition
        - exchangeWanted
        - id
        - category
        - area
        - images
        - owner
        - lifecycle
        - version
        - createdAt
        - updatedAt
      properties:
        type:
          type: string
          enum:
            - EXCHANGE
        title:
          $ref: "#/components/schemas/Title"
        description:
          $ref: "#/components/schemas/Description"
        condition:
          $ref: "#/components/schemas/Condition"
        exchangeWanted:
          type: string
          minLength: 1
          maxLength: 2000
        id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/LookupSummary"
        area:
          $ref: "#/components/schemas/LookupSummary"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ListingImage"
          minItems: 1
          maxItems: 8
        owner:
          $ref: "#/components/schemas/OwnerSummary"
        lifecycle:
          $ref: "#/components/schemas/Lifecycle"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Listing:
      oneOf:
        - $ref: "#/components/schemas/SellListing"
        - $ref: "#/components/schemas/BuyListing"
        - $ref: "#/components/schemas/ExchangeListing"
    ListingResponse:
      type: object
      additionalProperties: false
      required:
        - listing
      properties:
        listing:
          $ref: "#/components/schemas/Listing"
    OwnerListingPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
          maxItems: 50
        nextCursor:
          type: string
          maxLength: 1024
          nullable: true
    CatalogResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LookupSummary"
    TransitionRequest:
      type: object
      additionalProperties: false
      required:
        - action
        - expectedVersion
      properties:
        action:
          type: string
          enum:
            - COMPLETE
            - CLOSE
            - REMOVE
        expectedVersion:
          type: integer
          minimum: 1
    ListingMedia:
      type: object
      additionalProperties: false
      required:
        - id
        - url
        - width
        - height
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          pattern: ^https://
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        expiresAt:
          type: string
          format: date-time
    ListingMediaResponse:
      type: object
      additionalProperties: false
      required:
        - media
      properties:
        media:
          $ref: "#/components/schemas/ListingMedia"
    SubmissionStatus:
      oneOf:
        - $ref: "#/components/schemas/ProcessingSubmission"
        - $ref: "#/components/schemas/SuccessfulSubmission"
        - $ref: "#/components/schemas/FailedSubmission"
        - $ref: "#/components/schemas/ExpiredSuccessfulSubmission"
        - $ref: "#/components/schemas/ExpiredUnsuccessfulSubmission"
    SubmissionResponse:
      type: object
      additionalProperties: false
      required:
        - submission
      properties:
        submission:
          $ref: "#/components/schemas/SubmissionStatus"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHENTICATED
                - SESSION_EXPIRED
                - FORBIDDEN
                - NOT_FOUND
                - RATE_LIMITED
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
                - VERSION_CONFLICT
                - INVALID_TRANSITION
                - IDEMPOTENCY_CONFLICT
                - IDEMPOTENCY_IN_PROGRESS
                - IDEMPOTENCY_EXPIRED
                - MEDIA_UNAVAILABLE
                - INVALID_CURSOR
            message:
              type: string
              minLength: 1
              maxLength: 500
            requestId:
              type: string
              minLength: 1
              maxLength: 128
            fields:
              type: object
              additionalProperties:
                type: string
    ProcessingSubmission:
      type: object
      additionalProperties: false
      required:
        - key
        - operation
        - state
        - listingId
        - resultVersion
        - errorCode
        - replayUntil
      properties:
        key:
          type: string
          format: uuid
        operation:
          type: string
          enum:
            - CREATE
            - UPDATE
            - TRANSITION
        state:
          type: string
          enum:
            - PROCESSING
        listingId:
          type: string
          nullable: true
          enum:
            - null
        resultVersion:
          type: string
          nullable: true
          enum:
            - null
        errorCode:
          type: string
          nullable: true
          enum:
            - null
        replayUntil:
          type: string
          format: date-time
    SuccessfulSubmission:
      type: object
      additionalProperties: false
      required:
        - key
        - operation
        - state
        - listingId
        - resultVersion
        - errorCode
        - replayUntil
      properties:
        key:
          type: string
          format: uuid
        operation:
          type: string
          enum:
            - CREATE
            - UPDATE
            - TRANSITION
        state:
          type: string
          enum:
            - SUCCEEDED
        listingId:
          type: string
          format: uuid
        resultVersion:
          type: integer
          minimum: 1
        errorCode:
          type: string
          nullable: true
          enum:
            - null
        replayUntil:
          type: string
          format: date-time
    FailedSubmission:
      type: object
      additionalProperties: false
      required:
        - key
        - operation
        - state
        - listingId
        - resultVersion
        - errorCode
        - replayUntil
      properties:
        key:
          type: string
          format: uuid
        operation:
          type: string
          enum:
            - CREATE
            - UPDATE
            - TRANSITION
        state:
          type: string
          enum:
            - FAILED
        listingId:
          type: string
          nullable: true
          enum:
            - null
        resultVersion:
          type: string
          nullable: true
          enum:
            - null
        errorCode:
          type: string
          minLength: 1
          maxLength: 100
        replayUntil:
          type: string
          format: date-time
    ExpiredSuccessfulSubmission:
      type: object
      additionalProperties: false
      required:
        - key
        - operation
        - state
        - listingId
        - resultVersion
        - errorCode
        - replayUntil
      properties:
        key:
          type: string
          format: uuid
        operation:
          type: string
          enum:
            - CREATE
            - UPDATE
            - TRANSITION
        state:
          type: string
          enum:
            - EXPIRED
        listingId:
          type: string
          format: uuid
        resultVersion:
          type: integer
          minimum: 1
        errorCode:
          type: string
          nullable: true
          enum:
            - null
        replayUntil:
          type: string
          format: date-time
    ExpiredUnsuccessfulSubmission:
      type: object
      additionalProperties: false
      required:
        - key
        - operation
        - state
        - listingId
        - resultVersion
        - errorCode
        - replayUntil
      properties:
        key:
          type: string
          format: uuid
        operation:
          type: string
          enum:
            - CREATE
            - UPDATE
            - TRANSITION
        state:
          type: string
          enum:
            - EXPIRED
        listingId:
          type: string
          nullable: true
          enum:
            - null
        resultVersion:
          type: string
          nullable: true
          enum:
            - null
        errorCode:
          type: string
          nullable: true
        replayUntil:
          type: string
          format: date-time
  headers:
    NoStore:
      schema:
        type: string
        enum:
          - no-store
      description: Do not cache private data or mutation results.
    RetryAfter:
      schema:
        type: integer
        minimum: 1
      description: Seconds before a permitted retry; keep the same attempt key.
    IdempotencyReplayed:
      schema:
        type: string
        enum:
          - "true"
      description: Present on a successful replay; snapshot may be older than current listing version.
