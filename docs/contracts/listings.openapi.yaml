          uniqueItems: true
        expectedVersion:
          type: integer
          minimum: 1
    ExchangeListingInput:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - description
        - categoryId
        - areaId
        - condition
        - exchangeWanted
        - mediaIds
      properties:
        type:
          type: string
          enum:
            - EXCHANGE
        title:
          $ref: "#/components/schemas/Title"
        description:
          $ref: "#/components/schemas/Description"
        categoryId:
          type: string
          format: uuid
        areaId:
          type: string
          format: uuid
        condition:
          $ref: "#/components/schemas/Condition"
        exchangeWanted:
          type: string
          minLength: 1
          maxLength: 2000
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 8
          uniqueItems: true
    ExchangeListingUpdate:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - description
        - categoryId
        - areaId
        - condition
        - exchangeWanted
        - mediaIds
        - expectedVersion
      properties:
        type:
          type: string
          enum:
            - EXCHANGE
        title:
          $ref: "#/components/schemas/Title"
        description:
          $ref: "#/components/schemas/Description"
        categoryId:
          type: string
          format: uuid
        areaId:
          type: string
          format: uuid
        condition:
          $ref: "#/components/schemas/Condition"
        exchangeWanted:
          type: string
          minLength: 1
          maxLength: 2000
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 8
          uniqueItems: true
        expectedVersion:
          type: integer
          minimum: 1
    CreateListingRequest:
      oneOf:
        - $ref: "#/components/schemas/SellListingInput"
        - $ref: "#/components/schemas/BuyListingInput"
        - $ref: "#/components/schemas/ExchangeListingInput"
    UpdateListingRequest:
      oneOf:
        - $ref: "#/components/schemas/SellListingUpdate"
        - $ref: "#/components/schemas/BuyListingUpdate"
        - $ref: "#/components/schemas/ExchangeListingUpdate"
    OpenLifecycle:
      type: object
      additionalProperties: false
      required:
        - status
        - completion
        - removalActor
      properties:
        status:
          type: string
          enum:
            - OPEN
        completion:
          type: string
          nullable: true
          enum:
            - null
        removalActor:
          type: string
          nullable: true
          enum:
            - null
    CompletedLifecycle:
      type: object
      additionalProperties: false
      required:
        - status
        - completion
        - removalActor
      properties:
        status:
          type: string
          enum:
            - COMPLETED
        completion:
          type: string
          enum:
            - SOLD
            - FOUND
            - EXCHANGED
        removalActor:
          type: string
          nullable: true
          enum:
            - null
    ClosedLifecycle:
      type: object
      additionalProperties: false
      required:
        - status
        - completion
        - removalActor
      properties:
        status:
          type: string
          enum:
            - CLOSED
        completion:
          type: string
          nullable: true
          enum:
            - null
        removalActor:
          type: string
          nullable: true
          enum:
            - null
    RemovedLifecycle:
      type: object
      additionalProperties: false
      required:
        - status
        - completion
        - removalActor
      properties:
        status:
          type: string
          enum:
            - REMOVED
        completion:
          type: string
          nullable: true
          enum:
            - null
        removalActor:
          type: string
          enum:
            - OWNER
            - ADMIN
    Lifecycle:
      oneOf:
        - $ref: "#/components/schemas/OpenLifecycle"
        - $ref: "#/components/schemas/CompletedLifecycle"
        - $ref: "#/components/schemas/ClosedLifecycle"
        - $ref: "#/components/schemas/RemovedLifecycle"
    ListingImage:
      type: object
      additionalProperties: false
      required:
        - id
        - url
        - width
        - height
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          pattern: ^https://
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    SellListing:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - description
        - condition
        - price
        - id
        - category
        - area
        - images
        - owner
        - lifecycle
        - version
        - createdAt
        - updatedAt
